# An "IDE" tab for kitty-cmd-k, in kitty's own session syntax.
#
#   ┌──────────────┬──────────────┐
#   │              │  assistant   │
#   │    editor    ├──────────────┤
#   │              │    shell     │
#   └──────────────┴──────────────┘
#
# Reference it from a .kitty-cmd-k.toml or from cmd-k.toml:
#     session_file = "ide.conf"
#
# Honoured directives: new_tab, layout, cd, launch. Others are ignored.
# Commands run through `zsh -i -c` so your shell init (PATH, venvs, aliases)
# is loaded before the editor starts; swap zsh for your shell.

new_tab {repo} ({basename})
layout splits
cd {path}
launch --title editor zsh -i -c "nvim; exec zsh"
launch --title assistant --location=vsplit zsh -i -c "claude; exec zsh"
launch --title shell --location=hsplit zsh
